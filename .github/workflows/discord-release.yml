name: Discord Release Notification

'on':
  release:
    types:
      - published

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Gửi thông báo phát hành lên Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          AUTHOR_NAME: ${{ github.event.release.author.login }}
          REPOSITORY: ${{ github.repository }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          # ==================================================
          # THÔNG TIN RELEASE
          # ==================================================

          webhook = os.environ.get("DISCORD_WEBHOOK", "").strip()

          if not webhook:
              raise RuntimeError(
                  "❌ DISCORD_WEBHOOK không tồn tại. "
                  "Hãy kiểm tra GitHub Secrets."
              )

          release_tag = os.environ.get("RELEASE_TAG") or "Không xác định"
          release_url = os.environ.get("RELEASE_URL") or ""
          release_body = os.environ.get("RELEASE_BODY") or "Không có thông tin cập nhật."
          author = os.environ.get("AUTHOR_NAME") or "Không xác định"
          repository = os.environ.get("REPOSITORY") or "S82Studio/S82Coords"

          github_url = f"https://github.com/{repository}"

          # ==================================================
          # GIỚI HẠN DISCORD
          # Embed description tối đa 4096 ký tự.
          # Chừa khoảng trống cho phần giới thiệu.
          # ==================================================

          intro = (
              "🎉 **Một phiên bản mới của Coords đã được phát hành!**\n\n"
              "Hãy cập nhật lên phiên bản mới nhất để nhận "
              "những tính năng và sửa lỗi mới.\n\n"
              "━━━━━━━━━━━━━━━━━━━━\n"
              "✨ **NỘI DUNG CẬP NHẬT**\n\n"
          )

          max_release_length = 4096 - len(intro) - 100

          if len(release_body) > max_release_length:
              release_body = (
                  release_body[:max_release_length]
                  + "\n\n... *(Nội dung đã được rút gọn)*"
              )

          description = intro + release_body

          # ==================================================
          # DISCORD PAYLOAD
          # ==================================================

          payload = {
              "content": "@everyone",

              "allowed_mentions": {
                  "parse": ["everyone"]
              },

              "username": "S82Studio • Coords",

              "avatar_url": "https://github.com/S82Studio.png?size=128",

              "embeds": [
                  {
                      "title": f"🚀 PHIÊN BẢN MỚI — Coords {release_tag}",

                      "url": release_url,

                      "description": description,

                      # Sakura Pink
                      "color": 15235449,

                      "fields": [
                          {
                              "name": "📦 Phiên bản",
                              "value": f"`{release_tag}`",
                              "inline": True
                          },
                          {
                              "name": "👤 Phát hành bởi",
                              "value": f"`{author}`",
                              "inline": True
                          },
                          {
                              "name": "📁 Repository",
                              "value": f"`{repository}`",
                              "inline": False
                          }
                      ],

                      "thumbnail": {
                          "url": "https://github.com/S82Studio.png?size=256"
                      },

                      "footer": {
                          "text": "🐉 S82Studio • Coords",
                          "icon_url": "https://github.com/S82Studio.png?size=64"
                      },

                      "timestamp": datetime.now(
                          timezone.utc
                      ).isoformat()
                  }
              ],

              "components": [
                  {
                      "type": 1,
                      "components": [
                          {
                              "type": 2,
                              "style": 5,
                              "label": "📥 TẢI BẢN MỚI",
                              "url": release_url
                          },
                          {
                              "type": 2,
                              "style": 5,
                              "label": "🔗 GITHUB",
                              "url": github_url
                          }
                      ]
                  }
              ]
          }

          # ==================================================
          # GỬI REQUEST
          # ==================================================

          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          request = urllib.request.Request(
              webhook + "?wait=true",
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Actions-S82Coords"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  response_body = response.read().decode("utf-8")

                  print("======================================")
                  print("✅ Discord phản hồi:", response.status)
                  print("======================================")
                  print(response_body)

          except urllib.error.HTTPError as error:
              error_body = error.read().decode("utf-8", errors="replace")

              print("======================================")
              print("❌ DISCORD WEBHOOK ERROR")
              print("HTTP Status:", error.code)
              print("Response:")
              print(error_body)
              print("======================================")

              raise

          except Exception as error:
              print("======================================")
              print("❌ LỖI KHÔNG XÁC ĐỊNH")
              print(str(error))
              print("======================================")

              raise

          PY
